name: Danny browser smoke (desktop and emulated mobile)
on:
  push:
    branches: [main]
    paths:
      - 'tools/qa_browser.mjs'
      - 'tools/qa_level_runtime.mjs'
      - '.github/workflows/qa-browser.yml'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only Playwright and headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test published Danny build
        run: node tools/qa_browser.mjs
      - name: Test all 16 level loaders and controlled transitions
        run: node tools/qa_level_runtime.mjs

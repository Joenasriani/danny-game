name: Capture Danny visual QA screenshots
on:
  push:
    branches: [main]
    paths:
      - 'tools/capture_visual_qa.mjs'
      - '.github/workflows/capture-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser testing prerequisites
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture actual deployed Danny screens
        run: node tools/capture_visual_qa.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: danny-visual-qa
          path: docs/visual-evidence/
          retention-days: 30
      - name: Commit captured visual review evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual-evidence
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish actual Danny visual QA screenshots [skip ci]"
            git push origin HEAD:main
          fi

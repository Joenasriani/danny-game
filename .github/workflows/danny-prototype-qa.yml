name: Danny Living Sketch prototype QA
on:
  push:
    branches: [feature/danny-living-sketch-level1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original imported game and canonical image
        run: |
          python3 tools/validate_danny.py
          echo 'e4adce3822c367516ae2c5d6ca3d03b426e67feace021be5f8c92eda83735fe2  docs/character/reference/DANNY_CANONICAL_CHARACTER_SHEET.png' | sha256sum --check
      - name: Syntax and puppet rig construction invariants
        run: |
          node --check preview/danny/danny-art.js
          node tools/check_danny_puppet.cjs
  render-six-states:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve prototype from this isolated branch
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/danny-http.log 2>&1 &
      - name: Confirm the exact original sketch renders and all six states animate
        run: node tools/qa_danny_states.mjs
      - name: Publish screenshots of each state for real visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: danny-six-real-animated-states
          path: qa-output/danny-states/
          retention-days: 30

name: Deploy Danny to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: danny-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate authoritative Danny files
        run: python3 tools/validate_danny.py
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package independent Danny game
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Danny
        id: deployment
        uses: actions/deploy-pages@v4
